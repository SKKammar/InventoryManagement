server:
  port: 8080

spring:
  application:
    name: inventory-api

  datasource:
    url: jdbc:postgresql://db.dgufnkbmwaxtjtpdvvcn.supabase.co:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:your_dev_password_here}
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:supersecretkeyatleast64characterslongwhichissecureenoughtopasshs5121234567890}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days

logging:
  level:
    org.springframework.security: DEBUG
    com.example.inventory: DEBUG